name: AEGIS source contracts
on:
  pull_request:
    paths:
      - 'docs/contracts/**'
      - 'scripts/probe-aegis-sources.mjs'
      - 'scripts/probe-aegis-sources.test.mjs'
      - 'scripts/probe-amaru.mjs'
      - 'scripts/probe-amaru.test.mjs'
      - 'tests/test_source_envelope.py'
      - '.github/workflows/source-contracts.yml'
  push:
    paths:
      - 'docs/contracts/**'
      - 'scripts/probe-aegis-sources.mjs'
      - 'scripts/probe-aegis-sources.test.mjs'
      - 'scripts/probe-amaru.mjs'
      - 'scripts/probe-amaru.test.mjs'
      - 'tests/test_source_envelope.py'
      - '.github/workflows/source-contracts.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema==4.23.0'
      - run: python -m unittest discover -s tests -p 'test_source_envelope.py' -v
      - run: node --check scripts/probe-aegis-sources.mjs
      - run: node --test scripts/probe-aegis-sources.test.mjs
      - run: node --check scripts/probe-amaru.mjs
      - run: node --test scripts/probe-amaru.test.mjs
      # Deliberately no --live flag; CI is not allowed to poll providers.
